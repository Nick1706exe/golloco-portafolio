<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golloco — Artista Gráfico & Director Visual</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAF4;
  --ink:#1B1740;
  --blue:#3B2BFF;
  --pink:#FFC2DA;
  --mint:#BDF2D5;
  --sun:#FFE066;
  --line:#1B174020;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14112E;
    --ink:#ECEAF4;
    --line:#ECEAF420;
  }
}
:root[data-theme="dark"]{
  --bg:#14112E;
  --ink:#ECEAF4;
  --line:#ECEAF420;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:400 17px/1.55 "Instrument Sans",system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
  position:relative;
  transition:opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
h1,h2,h3{
  font-family:"Bricolage Grotesque",Georgia,sans-serif;
  line-height:.95;
  letter-spacing:-.03em;
}

/* Canvas del Minijuego Interactivo */
#game-canvas{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
  cursor:crosshair;
  touch-action:none;
}

/* Contenido de la Landing Page */
.landing-content{
  position:relative;
  z-index:10;
  max-width:760px;
  padding:40px 24px;
  pointer-events:none; /* Permite dibujar y jugar en el canvas detrás */
}
.landing-content a, .landing-content button{
  pointer-events:auto;
}

.landing-badge{
  display:inline-block;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  font-size:0.88rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:6px 18px;
  border-radius:99px;
  margin-bottom:20px;
  box-shadow:0 4px 14px rgba(59,43,255,0.3);
}

.landing-title{
  font-size:clamp(3.5rem,9vw,6.8rem);
  font-weight:800;
  margin-bottom:18px;
  letter-spacing:-.04em;
}

.landing-sub{
  font-size:clamp(1.18rem,3vw,1.45rem);
  opacity:.9;
  max-width:44ch;
  margin:0 auto 26px;
  line-height:1.45;
}

.game-hint{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:0.95rem;
  font-weight:600;
  background:rgba(27,23,64,0.06);
  padding:10px 20px;
  border-radius:99px;
  margin-bottom:34px;
  border:1px dashed var(--line);
  backdrop-filter:blur(6px);
}
.score-tag{
  color:var(--blue);
  font-weight:700;
}

.landing-actions{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn-continue{
  background:var(--ink);
  color:var(--bg);
  font-size:1.15rem;
  font-weight:700;
  padding:18px 40px;
  border-radius:99px;
  text-decoration:none;
  box-shadow:0 12px 30px rgba(27,23,64,0.25);
  transition:all .28s cubic-bezier(0.25, 1, 0.5, 1);
  display:inline-flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  border:none;
}
.btn-continue:hover{
  background:var(--blue);
  color:#fff;
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 16px 36px rgba(59,43,255,0.35);
}

/* Efecto de salida suave */
body.fade-out{
  opacity:0;
  transform:scale(0.98);
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div class="landing-content">
  <span class="landing-badge">Artista Gráfico & Director Visual</span>
  <h1 class="landing-title">Golloco</h1>
  <p class="landing-sub">Marcas con identidad propia, arte de autor y producción audiovisual de principio a fin.</p>

  <div class="game-hint">
    <span>🎨 Toca o desliza sobre la pantalla para atrapar arte</span>
    <span class="score-tag" id="score-display">Puntos: 0</span>
  </div>

  <div class="landing-actions">
    <button class="btn-continue" id="btn-enter" onclick="enterPortfolio()">
      Continuar al Perfil
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
/* Minijuego Interactivo de Partículas y Burbujas */
(function() {
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score-display');
  let score = 0;
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = ['#3B2BFF', '#FFC2DA', '#BDF2D5', '#FFE066', '#1B1740'];
  const orbs = [];
  const trails = [];

  class Orb {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * width;
      this.y = height + 40;
      this.radius = 20 + Math.random() * 26;
      this.speedY = 1.3 + Math.random() * 2.2;
      this.speedX = (Math.random() - 0.5) * 1.5;
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.text = ['Art', 'Branding', 'Golloco', 'Video', 'Content', 'Tattoo', '9:16', 'IA'][Math.floor(Math.random() * 8)];
      this.alpha = 0.88;
    }
    update() {
      this.y -= this.speedY;
      this.x += this.speedX;
      if (this.y < -50) this.reset();
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();

      ctx.fillStyle = (this.color === '#1B1740' || this.color === '#3B2BFF') ? '#fff' : '#1B1740';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.text, this.x, this.y);
      ctx.restore();
    }
  }

  for (let i = 0; i < 15; i++) {
    const orb = new Orb();
    orb.y = Math.random() * height;
    orbs.push(orb);
  }

  function popAt(x, y) {
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      if (Math.hypot(x - o.x, y - o.y) < o.radius + 15) {
        score += 10;
        scoreDisplay.textContent = 'Puntos: ' + score;
        for (let j = 0; j < 12; j++) {
          trails.push({
            x: o.x, y: o.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            color: o.color,
            radius: 3 + Math.random() * 4,
            life: 1
          });
        }
        o.reset();
      }
    }
  }

  function handleMove(e) {
    const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;

    trails.push({
      x, y,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      radius: 6 + Math.random() * 8,
      life: 1
    });

    popAt(x, y);
  }

  window.addEventListener('mousemove', handleMove);
  window.addEventListener('touchmove', handleMove, {passive:true});

  function animate() {
    ctx.clearRect(0, 0, width, height);
    orbs.forEach(o => { o.update(); o.draw(); });

    for (let i = trails.length - 1; i >= 0; i--) {
      const t = trails[i];
      t.x += t.vx;
      t.y += t.vy;
      t.life -= 0.025;
      t.radius *= 0.96;
      if (t.life <= 0) { trails.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = t.life;
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

/* Transición suave hacia el perfil */
function enterPortfolio() {
  document.body.classList.add('fade-out');
  setTimeout(() => {
    window.location.href = 'Golloco-portafolio.html';
  }, 500);
}
</script>

</body>
</html>
